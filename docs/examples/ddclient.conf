# NoDNS DynDNS v2 Client Configuration for ddclient
# ====================================================
#
# This configuration file shows how to use ddclient with NoDNS's
# backwards-compatible DynDNS v2 endpoint.
#
# SETUP:
# 1. Install ddclient: apt-get install ddclient (Debian/Ubuntu) or brew install ddclient (macOS)
# 2. Copy this file to /etc/ddclient.conf or ~/.ddclient/ddclient.conf
# 3. Replace npub1xxx... and nsec1xxx... with your actual Nostr keys
# 4. Run ddclient: ddclient -daemon=300 -syslog
#
# NoDNS Endpoint: https://nodns.shop/nic/update
# Dev Endpoint:   http://localhost:9090/nic/update
#
# AUTHENTICATION:
# - username (login): Your npub (Nostr public key, bech32 encoded)
# - password: Your nsec (Nostr private key, bech32 encoded)
#
# HOSTNAME FORMATS:
# - <name>.nodns.shop (for delegated subdomains)
# - npub1xxx.nodns.shop (for npub-based records)

# Global daemon settings
# -----------------------
# Check for IP changes every 5 minutes (300 seconds)
daemon=300

# Log to syslog (use syslog=yes on Linux, syslog=daemon on macOS)
syslog=yes

# PID file location
pid=/var/run/ddclient.pid

# Mail configuration (optional)
# mail=root
# mail-failure=root

# First example: Update a delegated subdomain with auto-detected public IP
# -------------------------------------------------------------------------
# This uses the web service to detect your public IP address automatically.
# Works for both IPv4 (A record) and IPv6 (AAAA record) depending on what
# the web service returns.

protocol=dyndns2
use=web
web=https://api64.ipify.org

# NoDNS server (use localhost:9090 for dev)
server=nodns.shop

# Your Nostr public key (npub) as the username
login=npub1xf9c4s8t5a2p3e4r5o6n7i8c9k0y1o2u3s4t5v6w7x8y9z0a1b2c3d4e5f6

# Your Nostr private key (nsec) as the password
# KEEP THIS SECURE - file should be readable only by root or your user
password=nsec1uf9c4s8t5a2p3e4r5o6n7i8c9k0y1o2u3s4t5v6w7x8y9z0a1b2c3d4e5f6

# The hostname to update (delegated subdomain)
hostname=myserver.nodns.shop

# Second example: Update based on local network interface
# -------------------------------------------------------
# Use this if you're behind NAT and want to use the local IP on a specific
# interface (e.g., eth0, en0, wlan0).

# protocol=dyndns2
# use=if
# if=eth0
# server=nodns.shop
# login=npub1xf9c4s8t5a2p3e4r5o6n7i8c9k0y1o2u3s4t5v6w7x8y9z0a1b2c3d4e5f6
# password=nsec1uf9c4s8t5a2p3e4r5o6n7i8c9k0y1o2u3s4t5v6w7x8y9z0a1b2c3d4e5f6
# hostname=internal.nodns.shop

# Third example: Update npub-based record
# ----------------------------------------
# You can also update records directly using your npub as the hostname.
# This is useful when you don't have a delegated subdomain.

# protocol=dyndns2
# use=web
# web=https://api64.ipify.org
# server=nodns.shop
# login=npub1xf9c4s8t5a2p3e4r5o6n7i8c9k0y1o2u3s4t5v6w7x8y9z0a1b2c3d4e5f6
# password=nsec1uf9c4s8t5a2p3e4r5o6n7i8c9k0y1o2u3s4t5v6w7x8y9z0a1b2c3d4e5f6
# hostname=npub1xf9c4s8t5a2p3e4r5o6n7i8c9k0y1o2u3s4t5v6w7x8y9z0a1b2c3d4e5f6.nodns.shop

# Fourth example: Force IPv4 only
# ---------------------------------
# Use the ipify v4 API to ensure only A records are updated.

# protocol=dyndns2
# use=web
# web=https://api.ipify.org
# server=nodns.shop
# login=npub1xf9c4s8t5a2p3e4r5o6n7i8c9k0y1o2u3s4t5v6w7x8y9z0a1b2c3d4e5f6
# password=nsec1uf9c4s8t5a2p3e4r5o6n7i8c9k0y1o2u3s4t5v6w7x8y9z0a1b2c3d4e5f6
# hostname=myserver.nodns.shop

# Fifth example: Force IPv6 only
# ---------------------------------
# Use the api64 service to ensure only AAAA records are updated.

# protocol=dyndns2
# use=web
# web=https://api64.ipify.org
# server=nodns.shop
# login=npub1xf9c4s8t5a2p3e4r5o6n7i8c9k0y1o2u3s4t5v6w7x8y9z0a1b2c3d4e5f6
# password=nsec1uf9c4s8t5a2p3e4r5o6n7i8c9k0y1o2u3s4t5v6w7x8y9z0a1b2c3d4e5f6
# hostname=myserver.nodns.shop
# ipv6=yes

# Sixth example: Multiple hostnames
# -----------------------------------
# You can update multiple hostnames with a single block.

# protocol=dyndns2
# use=web
# web=https://api64.ipify.org
# server=nodns.shop
# login=npub1xf9c4s8t5a2p3e4r5o6n7i8c9k0y1o2u3s4t5v6w7x8y9z0a1b2c3d4e5f6
# password=nsec1uf9c4s8t5a2p3e4r5o6n7i8c9k0y1o2u3s4t5v6w7x8y9z0a1b2c3d4e5f6
# hostname=server1.nodns.shop,server2.nodns.shop,server3.nodns.shop

# RESPONSES
# ----------
# ddclient will parse NoDNS's responses:
# - good 1.2.3.4        - Successfully updated to new IP
# - nochg 1.2.3.4       - IP unchanged (no update needed)
# - badauth             - Invalid npub or nsec
# - nohost              - Hostname not configured for this npub
# - notfqdn             - Invalid hostname format
# - 911                 - Server error

# TROUBLESHOOTING
# ---------------
# Test without daemon mode: ddclient -verbose -no-daemon
# Debug mode: ddclient -debug -verbose -no-daemon
# Force update: ddclient -force -verbose -no-daemon

# SSL/TLS
# -------
# By default ddclient uses SSL. NoDNS uses valid certificates.
# For development with self-signed certs, add: ssl=no