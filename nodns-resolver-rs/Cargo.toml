[package]
name = "nodns-resolver"
version = "0.1.0"
edition = "2021"
description = "NoDNS resolver SDK — DNS, Nostr, and tripartite verification"

[dependencies]
nostr-sdk = "0.44"
hickory-proto = "0.25"
hickory-client = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
base64 = "0.22"
hex = "0.4"
url = "2"
