# Knot DNS configuration snippet for NoDNS deployment
# Add this to /etc/knot/knot.conf on the VPS
#
# This configures the production zone:
#   nodns.shop
#
# =============================================================================
# SECURITY WARNING — do NOT attach mod-dnsproxy to the default template.
# =============================================================================
# The .cv pilot uses Knot's `mod-dnsproxy` module to forward non-authoritative
# queries to an upstream recursive resolver (Cloudflare 1.1.1.1). If this module
# is attached as a `global-module` on the `default` template, it applies to ALL
# queries for ALL zones and turns the public-facing authoritative server into a
# fully OPEN RECURSIVE RESOLVER — abusable for DDoS reflection/amplification.
#
# This exact misconfiguration triggered a BSI/Hetzner abuse report
# (CB-Report, 2026-07-07) against 46.224.104.12. The open resolver was closed
# by removing the line:
#     global-module: mod-dnsproxy/cv-forward
# from the `default` template on 2026-07-09.
#
# Rule: `mod-dnsproxy` (if needed at all) MUST be scoped to a specific zone's
# template (e.g. `cv-domain`), NEVER the `default` template. A bare
#     template:
#       - id: default
# entry with no `global-module` is the correct, safe configuration for the
# public authoritative server.
#
# Recommended additional hardening for the public authoritative listener
# (APPLIED in production on 2026-07-09 — verified working on Knot 3.3.4):
#
#   server:
#       nsid: ""          # blank the NSID (was leaking "inr.cashu.dev")
#       version: ""       # hide "Knot DNS 3.3.4" via version.bind CH TXT
#
#   mod-rrl:              # Response Rate Limiting — caps amplification abuse
#       - id: rrl         # even for authoritative (esp. DNSSEC-large) responses.
#         rate-limit: 200 # Knot 3.3.4 uses the mod-rrl MODULE (not a server key);
#         slip: 2         # `server.response-rate-limiting` is INVALID in 3.3.4.
#   template:
#       - id: default
#         global-module: mod-rrl/rrl
# =============================================================================

# ACL for the bot (TSIG authenticated updates)
acl:
  - id: nodns-bot
    key: nodns-bot
    action: update

# TSIG key (already configured, just showing for reference)
key:
  - id: nodns-bot
    algorithm: hmac-sha256
    secret: "REPLACE_WITH_REAL_SECRET"

# Zone definitions
zone:
  # nodns.shop — production
  - domain: nodns.shop
    file: "zones/nodns.shop.zone"
    notify: [puck]
    acl: [nodns-bot]
    # Enable DDNS journal to survive restarts
    journal-content: all
    zonefile-sync: -1
