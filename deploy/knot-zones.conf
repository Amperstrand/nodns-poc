# Knot DNS configuration snippet for multi-zone NoDNS deployment
# Add this to /etc/knot/knot.conf on the VPS
#
# This configures three zones:
#   1. nodns.shop — existing production zone
#   2. nostr.shop — new zone for nostr-native DNS
#   3. cv — demo zone simulating .cv TLD

# ACL for the bot (TSIG authenticated updates)
acl:
  - id: nodns-bot
    key: nodns-bot
    action: update

# TSIG key (already configured, just showing for reference)
key:
  - id: nodns-bot
    algorithm: hmac-sha256
    secret: "REPLACE_WITH_REAL_SECRET"

# Zone definitions
zone:
  # nodns.shop — production
  - domain: nodns.shop
    file: "zones/nodns.shop.zone"
    notify: [puck]
    acl: [nodns-bot]
    # Enable DDNS journal to survive restarts
    journal-content: all
    zonefile-sync: -1

  # nostr.shop — new
  - domain: nostr.shop
    file: "zones/nostr.shop.zone"
    notify: [puck]
    acl: [nodns-bot]
    journal-content: all
    zonefile-sync: -1

  # cv — demo zone
  - domain: cv
    file: "zones/cv.zone"
    acl: [nodns-bot]
    journal-content: all
    zonefile-sync: -1
    # No notify for .cv demo — we're not the real TLD
