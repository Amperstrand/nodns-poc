# Knot DNS configuration — production VPS (46.224.104.12)
# Deploy to /etc/knot/knot.conf
#
# SECRETS: the tsig_key_secret is REDACTED in this file.
# Replace <REDACTED> with the actual base64-encoded TSIG secret
# from the production config. Never commit real secrets.
#
# Security hardening applied 2026-07-09:
# - mod-rrl: Response Rate Limiting (rate-limit 200, slip 2)
# - nsid: "" — suppresses NSID disclosure (was leaking "inr.cashu.dev")
# - version: "" — suppresses version.bind CH TXT (was leaking "Knot DNS 3.3.4")
# - mod-dnsproxy: defined but NOT attached to any template (the open resolver
#   incident was caused by attaching it to the default template via global-module)
# See deploy/DEPLOY.md → "DNS hardening" for the full incident history.

server:
    listen: [ 0.0.0.0@53, ::@53 ]
    udp-workers: 2
    tcp-workers: 2
    background-workers: 2
    nsid: ""
    version: ""

key:
    - id: nodns-bot.
      algorithm: hmac-sha256
      secret: "<REDACTED>"

remote:
    - id: puck
      address: 204.42.254.5
    - id: cloudflare
      address: 1.1.1.1

acl:
    - id: puck_transfer
      action: transfer
      remote: puck
    - id: bot_update
      key: nodns-bot.
      action: update

policy:
    - id: nodns_dnssec
      algorithm: ECDSAP256SHA256
      nsec3: on
      nsec3-iterations: 0
      nsec3-salt-length: 0

zone:
    - domain: nodns.shop
      file: "/etc/knot/zones/nodns.shop.zone"
      acl: [ puck_transfer, bot_update ]
      notify: puck
      dnssec-signing: on
      dnssec-policy: nodns_dnssec
    - domain: nostr
      file: "/etc/knot/zones/nostr.zone"
      acl: [ bot_update ]
      dnssec-signing: on
      dnssec-policy: nodns_dnssec

log:
    - target: syslog
      any: info

zone:
    # Operator's home ISP DNS override (Altibox — Norwegian fiber provider).
    # These override the ISP's DNS for local network device management.
    # Safe to remove if rebuilding the VPS without home network integration.
    - domain: fw.altibox.net
      file: "/etc/knot/zones/fw.altibox.net.zone"

zone:
    - domain: hsi-acs.services.altibox.net
      file: "/etc/knot/zones/hsi-acs.services.altibox.net.zone"

zone:
    - domain: dns4sats.xyz
      file: "/etc/knot/zones/dns4sats.xyz.zone"
      acl: [ bot_update ]

mod-dnsproxy:
    - id: cv-forward
      remote: cloudflare

mod-rrl:
    - id: rrl
      rate-limit: 200
      slip: 2

template:
    - id: default
      global-module: mod-rrl/rrl
    - id: cv-domain
      storage: /etc/knot/zones
      file: "%s.zone"
      acl: [ bot_update ]
      journal-content: all
      zonefile-sync: -1
      dnssec-signing: off
