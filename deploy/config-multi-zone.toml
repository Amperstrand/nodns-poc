# NoDNS Bot — Production configuration
# Deploy to /opt/nodns-bot/config.toml on VPS

[server]
bind = "127.0.0.1:9090"

[nostr]
relays = [
    "wss://relay.cashu.email",
    "wss://relay.damus.io",
    "wss://nos.lol",
    "wss://relay.tollgate.me",
]
zone = "multi"
reconnect_min = "1s"
reconnect_max = "60s"

# nodns.shop (production)
[[dns.zones]]
zone = "nodns.shop"
knot_address = "127.0.0.1:5353"
tsig_key_name = "nodns-bot."
tsig_key_secret = "REPLACE_WITH_REAL_SECRET"
tsig_algorithm = "hmac-sha256"
dns_cache_events = true

[dns.zones.lease]
operator_lease_expires = "2027-06-04"

[policy]
max_records = 20
rate_limit = 5
allowed_types = ["A", "AAAA", "CNAME", "TXT", "MX"]
block_private_ip = true
max_txt_length = 512
min_pow = 0
min_pob_sats = 0
pob_notary_url = "https://notary.electrum.org/n/api"

[store]
path = "records.db"

# Payment configuration (placeholder — Cashu verification coming soon)
[payment]
enabled = false
required_sats = 250
update_free = true

# cv (pilot — bridge to .cv registry via EPP)
# All registrations are simulate=true until IP allowlist is confirmed.
[[dns.zones]]
zone = "cv"
knot_address = "127.0.0.1:5353"
tsig_key_name = "nodns-bot."
tsig_key_secret = "REPLACE_WITH_REAL_SECRET"
tsig_algorithm = "hmac-sha256"

[dns.zones.payment]
enabled = true
create_price = 30000
update_price = 15000
delete_price = 0
npub_names_free = false
mint_url = "https://testnut.cashu.space"
mint_filter = "testnut"

[dns.zones.lease]
grace_period_days = 7
max_lease_days = 3650

# EPP bridge to .cv registry (CoCCA)
# simulate=true: logs EPP intent, returns mock results.
# Flip simulate=false once registry IP allowlist is confirmed.
[epp]
host = "registry.ola.cv"
port = 700
username = "nostreppbridge"
password_env_var = "CV_EPP_PASSWORD"
pool_size = 1
timeout_secs = 90
simulate = true

# Registrar keys (bootstrap trust before any events are seen)
# zone → nostr pubkey hex
[registrar_keys]
nodns.shop = "REPLACE_WITH_REAL_REGISTRAR_PUBKEY_HEX"

# ACME certificate issuance (Let's Encrypt production)
# Private keys encrypted at rest with AES-256-GCM.
# Crash recovery: pending orders are swept at startup and marked failed.
[acme]
enabled = true
ca = "letsencrypt-production"
contact_email = "cert@nodns.shop"
challenge_ttl = 300
