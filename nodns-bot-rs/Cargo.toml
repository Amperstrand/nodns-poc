[package]
name = "nodns-bot"
version = "0.1.0"
edition = "2021"
description = "NoDNS bot — resolves DNS records from Nostr events"

[dependencies]
# Nostr
nostr-sdk = "0.44"

# Cashu (CDK) — no stable release available as of 2026-06; pin to RC and track for stable
cdk = "0.17.0-rc.3"
cashu = "0.17.0-rc.3"

# DNS (DDNS + TSIG)
hickory-client = "0.25"
hickory-proto = "0.25"

# IP network matching (CIDR validation)
ipnet = "2"

# Base64 decoding for TSIG secrets (Knot/BIND store HMAC keys base64-encoded
# per RFC 4648; hickory's TSigner::new expects raw bytes, so we must decode).
base64 = "0.22"

# SQLite
rusqlite = { version = "0.34", features = ["bundled"] }

# Config
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP (health endpoint)
axum = "0.8"
http = "1"
tower = "0.5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
thiserror = "2"

# Key derivation
hmac = "0.12"
hkdf = "0.12"
sha2 = "0.10"
p256 = { version = "0.13", features = ["pkcs8", "ecdsa"] }
pkcs8 = { version = "0.10", features = ["pem"] }

# ACME (Let's Encrypt DNS-01)
instant-acme = { version = "0.8", default-features = false, features = ["hyper-rustls", "ring"] }

# EPP (.cv registry bridge — RFC 5730-5734)
instant-epp = "0.4"

# Encryption at rest for ACME private keys
aes-gcm = "0.10"

# UUID generation for ACME order IDs
uuid = { version = "1", features = ["v4"] }

# JSON (for serializing ACME credentials to meta table)
serde_json = "1"

# HTTP client (Cloudflare API backend)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# TLS crypto provider (required by rustls used by instant-acme and nostr-sdk)
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }

# Rate limiting
tower_governor = { version = "0.8", features = ["axum"] }

# Security response headers
tower-http = { version = "0.6", features = ["set-header", "cors"] }
humantime = "2"
hex = "0.4"
url = "2"
regex = "1"

# NoDNS connector library (DNS backends: Knot DDNS, Cloudflare, failover)
nodns-connectors = { path = "../nodns-connectors" }

# NoDNS protocol library (kind 11111 record parsing + validation)
nodns-protocol = { path = "../nodns-protocol" }

# Error abstraction for DnsConnector trait
anyhow = "1"
