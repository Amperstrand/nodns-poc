name: Build + Deploy

on:
  push:
    branches: [main]
    paths:
      - 'nodns-bot-rs/**'
      - 'nodns-cli/**'
      - 'nodns-registrar/**'
      - 'nodns-explorer/**'
      - '.github/workflows/build-bot.yml'
  workflow_dispatch:
    inputs:
      deploy_bot:
        description: 'Deploy bot to VPS after build'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  build-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nodns-bot-rs/target
          key: ${{ runner.os }}-cargo-bot-${{ hashFiles('nodns-bot-rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bot-

      - name: Check formatting
        working-directory: nodns-bot-rs
        run: cargo fmt --check

      - name: Run clippy
        working-directory: nodns-bot-rs
        run: cargo clippy -- -D warnings

      - name: Build release binary
        working-directory: nodns-bot-rs
        run: cargo build --release

      - name: Run tests
        working-directory: nodns-bot-rs
        run: cargo test

      - name: Verify domain expiry config matches RDAP
        run: |
          chmod +x deploy/check-expiry.sh
          ./deploy/check-expiry.sh

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: nodns-bot-linux-x86_64
          path: nodns-bot-rs/target/release/nodns-bot
          retention-days: 30

  deploy-bot:
    needs: build-bot
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_bot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nodns-bot-linux-x86_64
          path: ./bot-binary

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "bot-binary/nodns-bot"
          target: "/opt/nodns-bot/"
          overwrite: true

      - name: Swap and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mv /opt/nodns-bot/bot-binary/nodns-bot /opt/nodns-bot/nodns-bot.new
            mv /opt/nodns-bot/nodns-bot /opt/nodns-bot/nodns-bot.old
            mv /opt/nodns-bot/nodns-bot.new /opt/nodns-bot/nodns-bot
            chmod +x /opt/nodns-bot/nodns-bot
            rmdir /opt/nodns-bot/bot-binary 2>/dev/null || true
            systemctl restart nodns-bot
            sleep 2
            systemctl is-active nodns-bot && echo "Bot deployed successfully" || (echo "Bot failed to start" && journalctl -u nodns-bot --no-pager -n 20)

  build-ts-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: nodns-cli
        run: npm ci

      - name: Typecheck
        working-directory: nodns-cli
        run: npm run typecheck

      - name: Smoke test — key generate
        working-directory: nodns-cli
        run: |
          OUTPUT=$(npx tsx src/index.ts key generate)
          echo "$OUTPUT" | grep -q 'nsec1'
          echo "$OUTPUT" | grep -q 'npub1'

      - name: Smoke test — zone-check (dry, no relay needed)
        working-directory: nodns-cli
        run: |
          npx tsx src/index.ts zone-check example.com 2>&1 | grep -q 'NOT opted in'

  build-registrar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: nodns-registrar
        run: npm ci

      - name: Typecheck
        working-directory: nodns-registrar
        run: npm run typecheck

      - name: Build
        working-directory: nodns-registrar
        run: npm run build

  build-explorer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: nodns-explorer
        run: npm ci

      - name: Typecheck
        working-directory: nodns-explorer
        run: npx tsc --noEmit

      - name: Build
        working-directory: nodns-explorer
        run: npm run build
