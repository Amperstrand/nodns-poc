name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'gh-pages/**'
      - 'content/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p /tmp/gh-pages
          cp gh-pages/index.html /tmp/gh-pages/
          # Replace symlink with actual file
          cp content/consensus.json /tmp/gh-pages/consensus.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/gh-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
