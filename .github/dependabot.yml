# 2026-11-14 fleet rollout (owner decision, green-PR interview): updates
# arrive GROUPED weekly instead of per-package PR streams — ends the
# dependabot churn class behind the 40-PR backlog the fleet review triaged.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      cargo-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: npm
    directory: "/nodns-registrar"
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: npm
    directory: "/nodns-frontend"
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: npm
    directory: "/nodns-resolver"
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: npm
    directory: "/nodns-clientlog-worker"
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"
