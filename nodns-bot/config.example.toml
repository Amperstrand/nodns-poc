[server]
bind = "127.0.0.1:9090"

[nostr]
relays = [
    "wss://relay.damus.io",
    "wss://nos.lol",
    "wss://relay.nostr.band",
    "wss://nostr.wine",
]
zone = "nodns.shop"
reconnect_min = "1s"
reconnect_max = "60s"

[dns]
knot_address = "127.0.0.1:5353"
zone = "nodns.shop"
tsig_key_name = "nodns-bot"
tsig_key_secret = ""
tsig_algorithm = "hmac-sha256"
default_ttl = 3600
negative_ttl = 60

[policy]
max_records = 20
rate_limit = 5
allowed_types = ["A", "AAAA", "CNAME", "TXT", "MX"]
block_private_ip = true
max_txt_length = 512

[store]
path = "records.db"
