[package]
name = "nodns-connectors"
version = "0.1.0"
edition = "2021"
description = "NoDNS DNS connector trait and implementations (Knot DDNS, Cloudflare)"

[dependencies]
hickory-client = { version = "0.25", features = ["dnssec-ring"] }
hickory-proto = { version = "0.25", features = ["dnssec-ring"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
serde_json = "1"

[dev-dependencies]
wiremock = "0.6"
